<!doctype html><html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#04050a">
<title>Create Server — MC Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.step{display:flex;gap:11px;margin-bottom:16px}
.step .n{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(100deg,rgba(139,92,246,.3),rgba(45,212,191,.15));border:1px solid var(--line2);font-family:var(--mono);font-size:11.5px;color:var(--violet2);font-weight:700}
.srvrow{padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:14px}
</style>
</head>
<body>
<div class="cine" aria-hidden="true">
  <div class="cine-aurora"><span class="aurora aurora--violet"></span><span class="aurora aurora--mint"></span><span class="aurora aurora--rose"></span><span class="aurora aurora--deep"></span></div>
  <div class="cine-grid"></div><div class="cine-vignette"></div><div class="cine-scan"></div><div class="cine-grain"></div>
</div>
<div class="scroll-progress" id="sp"></div><div class="cursor-glow" id="cg"></div>

<header class="nav"><div class="nav-inner">
  <a class="logo" href="/"><span class="logo-mark">⛏️</span><span>MC Panel</span></a>
  <div class="nav-actions"><a class="link-pill" href="/">Home</a><a class="link-pill" href="/admin">Admin</a><a class="btn primary" href="#">Create</a></div>
</div></header>

<div class="page" style="max-width:760px;padding-top:36px">
  <div class="kicker fade-up"><span class="pulse-dot"></span>auto jar download</div>
  <h1 class="fade-up d2" style="font-size:clamp(28px,4vw,42px);letter-spacing:-.04em;margin:14px 0 24px">New server in <span class="gradtext">1 minute.</span></h1>

  <div class="card fade-up d3" style="padding:24px">
    <div class="field">
      <label class="label">① Server name</label>
      <input class="input" id="name" placeholder="survival-1" spellcheck="false">
    </div>
    <div class="field" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><label class="label">② Platform</label>
        <select class="input" id="type" onchange="fillVer()">
          <option value="paper">📄 Paper — best performance</option><option value="purpur">🟣 Purpur</option>
          <option value="vanilla">🌱 Vanilla</option><option value="spigot">⚡ Spigot</option><option value="fabric">🧵 Fabric</option>
        </select></div>
      <div><label class="label">Version</label><select class="input" id="version"></select></div>
    </div>
    <div class="field" style="max-width:220px">
      <label class="label">③ RAM (MB)</label>
      <select class="input" id="ram"><option>1024</option><option selected>2048</option><option>3072</option><option>4096</option><option>6144</option><option>8192</option></select>
    </div>
    <div class="rowline" style="margin-top:8px">
      <button class="btn primary shine" onclick="create()">⬇ Create + Download</button>
      <span class="muted small" id="msg"></span>
    </div>
    <p class="muted small" style="margin:14px 0 0">☕ Java <b style="color:var(--mint2)">FULL AUTO</b> — version onujayi JRE panel nijei niye ase (17 system e ache, 1.21+ er jonno 21 auto-download hoy runtime folder e). Kichu install korar dorkar nei.</p>
  </div>

  <div style="margin:32px 0 14px"><div class="sec-index"><b style="color:var(--violet2)">—</b> / your servers</div></div>
  <div id="list">loading…</div>
</div>

<script>
let V={};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={paper:'📄',purpur:'🟣',vanilla:'🌱',spigot:'⚡',fabric:'🧵'};
addEventListener('scroll',()=>{const h=document.documentElement;$('#sp').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});
addEventListener('pointermove',e=>{$('#cg').style.left=e.clientX+'px';$('#cg').style.top=e.clientY+'px'});
async function versions(){try{V=await (await fetch('/api/versions')).json();fillVer();}catch{}}
function fillVer(){const arr=V[document.getElementById('type').value]||[];document.getElementById('version').innerHTML=arr.map(x=>`<option>${x}</option>`).join('');}
async function create(){
  const type=$('#type').value,version=$('#version').value,name=$('#name').value.trim(),ram=+$('#ram').value;
  if(!name)return alert('name daw');
  const m=$('#msg');m.style.color='var(--amber)';m.textContent='⬇ downloading '+type+' '+version+'…';
  try{
    const r=await (await fetch('/api/servers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,type,version,ram})})).json();
    if(r.error)throw new Error(r.error);
    m.style.color='var(--green)';m.textContent='✅ done ('+r.id+')';list();
  }catch(e){m.style.color='var(--red)';m.textContent='❌ '+e.message;}
}
async function list(){
  try{
    const d=await (await fetch('/api/servers')).json();
    $('#list').innerHTML=d.length?d.map(x=>`
      <div class="card srvrow hoverable">
        <div style="display:flex;gap:12px;align-items:center;min-width:0">
          <div class="avatar" style="width:40px;height:40px;font-size:19px">${ICON[x.type]||'🎮'}</div>
          <div><b>${esc(x.name)}</b><br><span class="muted small">${x.type} ${x.version} • ${x.ram||4096}MB</span></div>
        </div>
        <div class="rowbtn">
          <button class="btn primary sm" onclick="location.href='/server/${x.id}'">🖥️ Panel</button>
          ${x.running?`<button class="btn stop sm" onclick="stop1('${x.id}')">■ Stop</button>`:`<button class="btn start sm" onclick="start1('${x.id}')">▶ Start</button>`}
        </div>
      </div>`).join(''):'<div class="empty">kono server nai — upor theke create koro</div>';
  }catch(e){$('#list').innerHTML='<div class="empty">load fail</div>'}
}
async function start1(id){const r=await (await fetch(`/api/servers/${id}/start`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();if(r&&r.msg)alert(r.msg);setTimeout(list,1500);}
async function stop1(id){await fetch(`/api/servers/${id}/stop`,{method:'POST'});setTimeout(list,1500);}
versions();list();setInterval(list,10000);
</script>
</body>
</html>
