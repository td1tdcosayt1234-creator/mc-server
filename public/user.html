<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#04050a">
<title>Create Server — MC Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.step{display:flex;gap:11px;margin-bottom:16px}
.step .n{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(100deg,rgba(139,92,246,.3),rgba(45,212,191,.15));border:1px solid var(--line2);font-family:var(--mono);font-size:11.5px;color:var(--violet2);font-weight:700}
.srvrow{padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:14px}
/* custom platform dropdown — native option e logo jay na, tai nijer listbox */
.pdrop{position:relative}
.pdrop-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;cursor:pointer;text-align:left}
.pdrop-btn img{width:20px;height:20px;border-radius:6px;display:block;flex:none}
.pdrop-btn b{font-size:13.5px;color:var(--text);font-weight:600}
.pdrop-arrow{margin-left:auto;color:var(--muted);transition:transform .18s ease;font-size:12px}
.pdrop.open .pdrop-arrow{transform:rotate(180deg)}
.pdrop-panel{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;max-height:328px;overflow:auto;border-radius:14px;border:1px solid var(--line2);background:#0b0d17;box-shadow:0 18px 44px rgba(0,0,0,.55);padding:6px}
.pdrop.open .pdrop-panel{display:block;animation:ddin .16s ease}
@keyframes ddin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.pdrop-g{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);padding:9px 12px 4px}
.pdrop-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;cursor:pointer;transition:background .12s}
.pdrop-item img{width:20px;height:20px;border-radius:6px;flex:none;display:block}
.pdrop-item b{font-size:13px;display:block;font-weight:600}
.pdrop-item .d{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.pdrop-item:hover,.pdrop-item.on{background:rgba(139,92,246,.13)}
.pdrop-item.on{background:rgba(45,212,191,.12)}
</style>
</head>
<body>
<div class="cine" aria-hidden="true">
  <div class="cine-aurora"><span class="aurora aurora--violet"></span><span class="aurora aurora--mint"></span><span class="aurora aurora--rose"></span><span class="aurora aurora--deep"></span></div>
  <div class="cine-grid"></div><div class="cine-vignette"></div><div class="cine-scan"></div><div class="cine-grain"></div>
</div>
<div class="scroll-progress" id="sp"></div><div class="cursor-glow" id="cg"></div>

<header class="nav"><div class="nav-inner">
  <a class="logo" href="/"><span class="logo-mark">⛏️</span><span>MC Panel</span></a>
  <div class="nav-actions"><a class="link-pill" href="/">Home</a><a class="link-pill" href="/pricing">Pricing</a><a class="link-pill" href="/status">Status</a><a class="btn primary" href="#">Create</a></div>
</div></header>

<div class="page" style="max-width:760px;padding-top:36px">
  <div class="kicker fade-up"><span class="pulse-dot"></span>auto jar download</div>
  <h1 class="fade-up d2" style="font-size:clamp(28px,4vw,42px);letter-spacing:-.04em;margin:14px 0 24px">New server in <span class="gradtext">1 minute.</span></h1>

  <div class="card fade-up d3" style="padding:24px">
    <div class="field">
      <label class="label">① Server name</label>
      <input class="input" id="name" placeholder="survival-1" spellcheck="false">
    </div>
    <div class="field grid2c" style="gap:12px">
      <div><label class="label">② Platform</label>
        <div class="pdrop" id="typeDd">
          <button type="button" class="input pdrop-btn" id="typeBtn" aria-haspopup="listbox" aria-expanded="false">
            <span id="typeLabel" style="display:flex;align-items:center;gap:9px;min-width:0"></span>
            <span class="pdrop-arrow">▾</span>
          </button>
          <div class="pdrop-panel" id="typePanel" role="listbox"></div>
          <input type="hidden" id="type" value="paper">
        </div></div>
      <div><label class="label">Version</label><select class="input" id="version"></select></div>
    </div>
    <div class="grid2c" style="gap:12px">
      <div><label class="label">③ RAM (MB)</label>
        <select class="input" id="ram"><option>1024</option><option selected>2048</option><option>3072</option><option>4096</option><option>6144</option><option>8192</option></select></div>
      <div><label class="label">④ CPU cores</label>
        <select class="input" id="cpu"><option value="0" selected>Auto (all cores)</option><option value="1">1 core</option><option value="2">2 cores</option><option value="3">3 cores</option><option value="4">4 cores</option><option value="6">6 cores</option><option value="8">8 cores</option></select></div>
    </div>
    <div class="rowline" style="margin-top:8px">
      <button class="btn primary shine" onclick="create()">⬇ Create + Download</button>
      <span class="muted small" id="msg"></span>
    </div>
    <p class="muted small" style="margin:14px 0 0">☕ Java <b style="color:var(--mint2)">FULL AUTO</b> — the panel fetches the right JRE for the version automatically (17 on system, 21 for 1.21+ downloads into the runtime folder). Nothing to install.</p>
  </div>

  <div style="margin:32px 0 14px"><div class="sec-index"><b style="color:var(--violet2)">—</b> / your servers</div></div>
  <div id="list">loading…</div>
</div>

<script>
let V={};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={paper:'📄',purpur:'🟣',vanilla:'🌱',spigot:'⚡',fabric:'🧵',folia:'🍃',quilt:'🪡',neoforge:'🔥',forge:'⚒️',velocity:'🪂',waterfall:'🌊',bungeecord:'🔗',mohist:'🏮',arclight:'💡',leaf:'🍃',craftbukkit:'🔨'};
// real logos — github org avatars (github.com/<Org>.png hotlink, onerror hole emoji thakbe)
const LOGO={paper:'PaperMC',folia:'PaperMC',waterfall:'PaperMC',purpur:'PurpurMC',vanilla:'Mojang',spigot:'SpigotMC',craftbukkit:'Bukkit',fabric:'FabricMC',quilt:'QuiltMC',neoforge:'neoforged',forge:'MinecraftForge',velocity:'VelocityPowered',mohist:'MohistMC',arclight:'Arclight-Team',leaf:'Winds-Studio'};
const logo=t=>`https://github.com/${LOGO[t]||''}.png?size=48`;
const avat=t=>LOGO[t]?`<img src="${logo(t)}" alt="${t}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" onerror="this.outerHTML='${ICON[t]||'🎮'}'">`:(ICON[t]||'🎮');
// platform dropdown — real logo shoho meta (label + desc + group)
const PLATS=[
  {t:'paper',g:'Bukkit family (plugins)',d:'best performance'},
  {t:'folia',g:'Bukkit family (plugins)',d:'multithreaded regions'},
  {t:'purpur',g:'Bukkit family (plugins)',d:'paper + extras'},
  {t:'spigot',g:'Bukkit family (plugins)',d:'classic'},
  {t:'craftbukkit',g:'Bukkit family (plugins)',d:'vanilla + bukkit'},
  {t:'leaf',g:'Bukkit family (plugins)',d:'paper fork (performance)'},
  {t:'vanilla',g:'Vanilla / modded',d:'official'},
  {t:'fabric',g:'Vanilla / modded',d:'mods'},
  {t:'quilt',g:'Vanilla / modded',d:'mods'},
  {t:'neoforge',g:'Vanilla / modded',d:'big mods'},
  {t:'forge',g:'Vanilla / modded',d:'classic mods (1.17+)'},
  {t:'mohist',g:'Hybrid (mods + plugins)',d:'Forge + Bukkit'},
  {t:'arclight',g:'Hybrid (mods + plugins)',d:'Forge + Bukkit'},
  {t:'velocity',g:'Proxies',d:'modern proxy'},
  {t:'waterfall',g:'Proxies',d:'bungee fork'},
  {t:'bungeecord',g:'Proxies',d:'classic proxy'}
];
const cap1=t=>t.charAt(0).toUpperCase()+t.slice(1);
function buildTypeDd(){
  const p=document.getElementById('typePanel');let h='',lg='';
  for(const it of PLATS){
    if(it.g!==lg){h+=`<div class="pdrop-g">${it.g}</div>`;lg=it.g;}
    h+=`<div class="pdrop-item" data-t="${it.t}" role="option"><img src="${logo(it.t)}" alt="" onerror="this.style.display='none'"><div><b>${cap1(it.t)}</b><span class="d">${it.d}</span></div></div>`;
  }
  p.innerHTML=h;
  p.querySelectorAll('.pdrop-item').forEach(el=>el.onclick=()=>setType(el.dataset.t));
}
function setType(t){
  document.getElementById('type').value=t;
  const it=PLATS.find(x=>x.t===t)||{t,d:''};
  document.getElementById('typeLabel').innerHTML=
    `<img src="${logo(t)}" alt="" onerror="this.style.display='none'"><b>${cap1(t)}</b><span class="d" style="margin-left:2px">— ${it.d}</span>`;
  document.querySelectorAll('.pdrop-item').forEach(el=>el.classList.toggle('on',el.dataset.t===t));
  fillVer();
}
// dropdown khola/boja + bahirer click/Esc hole close
function toggleDd(f){const dd=document.getElementById('typeDd');f=arguments.length?f:!dd.classList.contains('open');dd.classList.toggle('open',f);document.getElementById('typeBtn').setAttribute('aria-expanded',f);}
document.getElementById('typeBtn').addEventListener('click',e=>{e.stopPropagation();toggleDd();});
document.addEventListener('click',e=>{if(document.getElementById('typeDd').classList.contains('open')&&!e.target.closest('.pdrop'))toggleDd(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleDd(false);});
async function versions(){try{V=await (await fetch('/api/versions')).json();}catch{}fillVer();}
// page-load e default platform (paper) dropdown e dekhao
buildTypeDd();setType('paper');
function fillVer(){const arr=V[document.getElementById('type').value]||[];document.getElementById('version').innerHTML=arr.map(x=>`<option>${x}</option>`).join('');}
async function create(){
  const type=$('#type').value,version=$('#version').value,name=$('#name').value.trim(),ram=+$('#ram').value,cpu=+$('#cpu').value;
  if(!name)return alert('Enter a server name');
  const m=$('#msg');m.style.color='var(--amber)';m.textContent='⬇ downloading '+type+' '+version+'…';
  try{
    const r=await (await fetch('/api/servers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,type,version,ram,cpu})})).json();
    if(r.error)throw new Error(r.error);
    m.style.color='var(--green)';m.textContent='✅ done ('+r.id+')';list();
  }catch(e){m.style.color='var(--red)';m.textContent='❌ '+e.message;}
}
async function list(){
  try{
    const r=await fetch('/api/servers');
    if(r.status===401){$('#list').innerHTML='<div class="empty">🔒 login required — <a href="/login">login →</a></div>';return}
    const d=await r.json();
    $('#list').innerHTML=d.length?d.map(x=>`
      <div class="card srvrow hoverable">
        <div style="display:flex;gap:12px;align-items:center;min-width:0">
          <div class="avatar" style="width:40px;height:40px;font-size:19px;overflow:hidden">${avat(x.type)}</div>
          <div><b>${esc(x.name)}</b><br><span class="muted small">${x.type} ${x.version} • ${x.ram||4096}MB${x.cpu?` • ${x.cpu} cores`:''}</span></div>
        </div>
        <div class="rowbtn">
          <button class="btn primary sm" onclick="location.href='/server/${x.id}'">🖥️ Panel</button>
          ${x.running?`<button class="btn stop sm" onclick="stop1('${x.id}')">■ Stop</button>`:`<button class="btn start sm" onclick="start1('${x.id}')">▶ Start</button>`}
        </div>
      </div>`).join(''):'<div class="empty">no servers yet — create one above</div>';
  }catch(e){$('#list').innerHTML='<div class="empty">load fail</div>'}
}
async function start1(id){
  try{
    const r=await (await fetch(`/api/servers/${id}/start`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();
    if(r&&r.error)alert(r.error); else if(r&&r.msg)alert(r.msg);
  }catch(e){alert('start fail: '+e.message)}
  setTimeout(list,1500);
}
async function stop1(id){await fetch(`/api/servers/${id}/stop`,{method:'POST'});setTimeout(list,1500);}
versions();list();setInterval(list,10000);
</script>
<script src="/ux.js"></script>
</body>
</html>
