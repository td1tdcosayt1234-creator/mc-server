<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Panel - MC</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}input,select,button{padding:8px;margin:4px;border-radius:6px;border:1px solid #334155;background:#0b1120;color:#e2e8f0}button{background:#22c55e;color:#052e16;border:0;cursor:pointer;font-weight:bold}.card{background:#1e293b;padding:12px;border-radius:10px;margin:10px 0}.term{background:#000;color:#4ade80;font-family:monospace;font-size:12px;height:260px;overflow-y:auto;padding:10px;border-radius:8px;white-space:pre-wrap}.row{display:flex;gap:6px}.row input{flex:1}a{color:#22c55e}</style></head>
<body><a href="/">← Home</a> <a href="/admin">Admin →</a><h2>🎮 User Panel</h2>
<div class="card"><h3>New Server - auto download</h3>
<input id="name" placeholder="server name (my-server)">
<select id="type" onchange="fillVer()"><option value="paper">Paper</option><option value="purpur">Purpur</option><option value="vanilla">Vanilla</option><option value="spigot">Spigot</option><option value="fabric">Fabric</option></select>
<select id="version"></select>
<input id="ram" type="number" value="4096" style="width:90px"> MB
<button onclick="create()">Create + Download</button><span id="msg"></span></div>
<div id="list"></div>
<script>
let V={}, sel=null, es=null;
async function versions(){V=await (await fetch('/api/versions')).json();fillVer();}
function fillVer(){const t=document.getElementById('type').value;const arr=V[t]||[];document.getElementById('version').innerHTML=arr.map(x=>`<option>${x}</option>`).join('');}
async function list(){const d=await (await fetch('/api/servers')).json();document.getElementById('list').innerHTML=d.map(s=>`<div class="card"><b>${s.name}</b> <small>${s.type} ${s.version} ${s.ram||''}MB</small> ${s.running?'🟢 Running':'🔴 Off'} <button onclick="start('${s.id}')">Start</button> <button onclick="stop('${s.id}')">Stop</button> <button onclick="backup('${s.id}')">Backup Drive</button> <button onclick="openTerm('${s.id}')">Terminal</button><div id="t-${s.id}" style="display:none"><div class="term" id="log-${s.id}">...</div><div class="row"><input id="cmd-${s.id}" placeholder="say hi / op name / stop" onkeydown="if(event.key==='Enter')send('${s.id}')"><button onclick="send('${s.id}')">Send</button></div></div></div>`).join('');}
async function create(){const type=document.getElementById('type').value,version=document.getElementById('version').value,name=document.getElementById('name').value,ram=+document.getElementById('ram').value;if(!name)return alert('name daw');document.getElementById('msg').innerText='downloading...';const r=await (await fetch('/api/servers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,type,version,ram})})).json();document.getElementById('msg').innerText=r.error||'done';list();}
async function start(id){await fetch(`/api/servers/${id}/start`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ram:4096})});list();}
async function stop(id){await fetch(`/api/servers/${id}/stop`,{method:'POST'});list();}
async function backup(id){const r=await (await fetch(`/api/servers/${id}/backup`,{method:'POST'})).json();alert(r.file||r.error||'done');}
async function openTerm(id){sel=id;const d=document.getElementById('t-'+id);d.style.display=d.style.display==='none'?'block':'none';const logs=await (await fetch(`/api/servers/${id}/logs?tail=150`)).json();document.getElementById('log-'+id).innerText=logs.logs.join('\n');document.getElementById('log-'+id).scrollTop=1e9;if(es)es.close();es=new EventSource(`/api/servers/${id}/console`);es.onmessage=e=>{const el=document.getElementById('log-'+id);if(!el)return;el.innerText+=(JSON.parse(e.data)+'\n');el.scrollTop=el.scrollHeight;};}
async function send(id){const inp=document.getElementById('cmd-'+id);await fetch(`/api/servers/${id}/command`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd:inp.value})});inp.value='';}
versions();list();setInterval(list,15000);
</script></body></html>
