<!doctype html><html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MC Panel - New Server</title>
<style>
:root{--bg:#0e141d;--card:#151f2b;--line:#24313f;--txt:#d8e1ec;--dim:#8798aa;--green:#43b56d;--accent:#4a9fd8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
header{background:#0b1119;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;align-items:center}
header a{color:var(--dim);text-decoration:none;margin-right:14px}
main{max-width:760px;margin:auto;padding:26px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
input,select{width:100%;background:#0b1014;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px;font-family:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#1d5c37;color:#fff;cursor:pointer;font-weight:700}
button.sec{background:#19242f;box-shadow:none}
.msg{font-size:13px;color:var(--green);margin-left:10px}
.srv{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#5a6672;display:inline-block;margin-right:8px}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.offn{background:#5a6672}
small{color:var(--dim)}
a.plink{color:#fff;background:#1a3f61;text-decoration:none;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600}
a.plink2{color:var(--accent);text-decoration:none;font-size:13px}
</style>
</head>
<body>
<header><div><a href="/">← Home</a><b>⛏️ Servers</b></div><nav><a href="/admin">Admin →</a></nav></header>
<main>
<div class="card">
  <h3>➕ Create New Server (auto jar download)</h3>
  <div class="row">
    <div><label>Server name</label><input id="name" placeholder="survival-1"></div>
    <div><label>RAM (MB)</label><input id="ram" type="number" value="4096"></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div><label>Platform</label><select id="type" onchange="fillVer()">
      <option value="paper">Paper (best-perf)</option><option value="purpur">Purpur</option>
      <option value="vanilla">Vanilla</option><option value="spigot">Spigot</option><option value="fabric">Fabric</option></select></div>
    <div><label>Version</label><select id="version"></select></div>
  </div>
  <div style="margin-top:12px"><button onclick="create()">Create + Download</button><span class="msg" id="msg"></span></div>
</div>
<div id="list">loading...</div>
</main>
<script>
let V={};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function versions(){try{V=await (await fetch('/api/versions')).json();fillVer();}catch{}}
function fillVer(){const arr=V[document.getElementById('type').value]||[];document.getElementById('version').innerHTML=arr.map(x=>`<option>${x}</option>`).join('');}
async function create(){
  const type=document.getElementById('type').value,version=document.getElementById('version').value,name=document.getElementById('name').value.trim(),ram=+document.getElementById('ram').value;
  if(!name)return alert('name daw');
  const m=document.getElementById('msg');
  m.innerText='⬇ downloading jar '+type+' '+version;
  try{
    const r=await (await fetch('/api/servers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,type,version,ram})})).json();
    if(r.error)throw new Error(r.error);
    m.innerText='✅ done ('+r.id+')';
    list();
  }catch(e){m.innerText='❌ '+e.message;}
}
async function list(){
  try{
    const d=await (await fetch('/api/servers')).json();
    document.getElementById('list').innerHTML=d.length?d.map(x=>`
      <div class="srv">
        <div><span class="dot ${x.running?'on':''}"></span><b>${esc(x.name)}</b> <small>${x.type} ${x.version} • ${x.ram||4096}MB</small></div>
        <div><a class="plink" href="/server/${x.id}">🖥️ Open Panel</a>${x.running?` <a class="plink2" href="#" onclick="stop1('${x.id}');return false">Stop</a>`:` <a class="plink2" href="#" onclick="start1('${x.id}');return false">Start</a>`}</div>
      </div>`).join(''):' kono server nai - upor theke create koro';
  }catch(e){document.getElementById('list').innerText='load fail';}
}
async function start1(id){await fetch(`/api/servers/${id}/start`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});list();}
async function stop1(id){await fetch(`/api/servers/${id}/stop`,{method:'POST'});list();}
versions();list();setInterval(list,10000);
</script>
</body>
</html>
