<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#04050a">
<title>Admin — MC Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.userrow{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid hsla(0,0%,100%,.05)}
.userrow:last-child{border-bottom:0}
.rolechip{font-size:10px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:hsla(0,0%,100%,.04);border:1px solid var(--line);color:var(--muted)}
.rolechip.admin{border-color:rgba(139,92,246,.35);color:var(--violet2)}
.srvrow{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:10px}
</style>
</head>
<body>
<div class="cine" aria-hidden="true">
  <div class="cine-aurora"><span class="aurora aurora--violet"></span><span class="aurora aurora--mint"></span><span class="aurora aurora--rose"></span><span class="aurora aurora--deep"></span></div>
  <div class="cine-grid"></div><div class="cine-vignette"></div><div class="cine-scan"></div><div class="cine-grain"></div>
</div>
<div class="scroll-progress" id="sp"></div><div class="cursor-glow" id="cg"></div>

<header class="nav"><div class="nav-inner">
  <a class="logo" href="/"><span class="logo-mark">⛏️</span><span>MC Panel</span></a>
  <div class="nav-actions"><a class="link-pill" href="/">Home</a><a class="link-pill" href="/pricing">Pricing</a><a class="link-pill" href="/status">Status</a><a class="btn primary" href="#">Admin</a></div>
</div></header>

<div class="page" style="max-width:860px;padding-top:36px">
  <div class="kicker fade-up"><span class="pulse-dot"></span>admin zone</div>
  <h1 class="fade-up d2" style="font-size:clamp(26px,4vw,40px);letter-spacing:-.04em;margin:14px 0 26px">Users &amp; <span class="gradtext">servers.</span></h1>

  <div class="card fade-up d3" style="padding:22px;margin-bottom:18px">
    <div class="rowline" style="margin-bottom:12px;justify-content:space-between">
      <h3 style="margin:0">👥 Users</h3>
      <span class="muted small" id="whoami"></span>
    </div>
    <div class="rowline" style="margin-bottom:14px">
      <input class="input" id="uname" placeholder="Name" style="max-width:150px">
      <input class="input flex1" id="email" placeholder="email@gmail.com" style="max-width:280px">
      <input class="input" id="upw" type="password" placeholder="password (min 6)" style="max-width:180px">
      <select class="input" id="role" style="width:100px"><option>user</option><option>admin</option></select>
      <button class="btn primary sm" onclick="addUser()">+ Add</button>
      <span class="muted small" id="ustat"></span>
    </div>
    <div id="users"><div class="empty">loading…</div></div>
  </div>

  <div class="card fade-up d3" style="padding:22px;margin-bottom:18px">
    <h3 style="margin:0 0 12px">⚙️ Panel Security</h3>
    <div class="rowline">
      <label class="toggle"><input type="checkbox" id="reqLogin" onchange="saveSettings()"><i></i></label>
      <div>
        <b style="font-size:14px">Login required</b>
        <div class="muted small">on = panel access needs an account · owners only see their own servers · off = open mode (like before)</div>
      </div>
      <span class="muted small" id="setStat" style="margin-left:auto"></span>
    </div>
  </div>

  <div class="card fade-up d4" style="padding:22px">
    <h3 style="margin:0 0 14px">🖥️ All Servers</h3>
    <div id="list"><div class="empty">loading…</div></div>
  </div>
</div>
<div class="toast" id="tip"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={paper:'📄',purpur:'🟣',vanilla:'🌱',spigot:'⚡',fabric:'🧵',folia:'🍃',quilt:'🪡',neoforge:'🔥',forge:'⚒️',velocity:'🪂',waterfall:'🌊',bungeecord:'🔗',mohist:'🏮',arclight:'💡',leaf:'🍃',craftbukkit:'🔨'};
// real logos — github org avatar hotlink (onerror → emoji fallback)
const LOGO={paper:'PaperMC',folia:'PaperMC',waterfall:'PaperMC',purpur:'PurpurMC',vanilla:'Mojang',spigot:'SpigotMC',craftbukkit:'Bukkit',fabric:'FabricMC',quilt:'QuiltMC',neoforge:'neoforged',forge:'MinecraftForge',velocity:'VelocityPowered',mohist:'MohistMC',arclight:'Arclight-Team',leaf:'Winds-Studio'};
const logo=t=>`https://github.com/${LOGO[t]||''}.png?size=48`;
const avat=t=>LOGO[t]?`<img src="${logo(t)}" alt="${t}" style="width:19px;height:19px;vertical-align:-4px;border-radius:5px" onerror="this.outerHTML='${ICON[t]||'🎮'}'">`:(ICON[t]||'🎮');
let ME=null;
function toast(msg,typ='ok'){const t=$('#tip');t.textContent=msg;t.className='toast show '+typ;clearTimeout(t._to);t._to=setTimeout(()=>t.className='toast',2600)}
// chrome anims → /ux.js
// auth guard: admin na hole login e pathai
async function me(){
  try{
    const j=await (await fetch('/api/auth/me')).json();
    ME=j.user;
    if(!ME){location.href='/login';return null}
    $('#whoami').textContent=(ME.role==='admin'?'👑 ':'👤 ')+ME.name+' ('+ME.role+')';
    if(ME.role!=='admin'){$('#list').innerHTML='<div class="empty">🔒 admin only page — your dashboard: <a href="/user">/user</a></div>';users();$('#users').innerHTML='<div class="empty">🔒 admin only</div>';$('#reqLogin').disabled=true;return ME}
    try{
      const s=await (await fetch('/api/auth/settings')).json();
      $('#reqLogin').checked=!!s.requireLogin;
      $('#reqLogin').disabled=false;
      $('#setStat').textContent=s.requireLogin?'active':'open (off)';
    }catch{}
  }catch(e){}
  return ME;
}
async function saveSettings(){
  const on=$('#reqLogin').checked;
  try{
    const r=await (await fetch('/api/auth/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requireLogin:on})})).json();
    if(r.error){toast('❌ '+r.error,'bad');return}
    $('#setStat').textContent=on?'✅ login required ON':'✅ open mode (login off)';
    toast('Panel security save ✅');
  }catch(e){toast('❌ '+e.message,'bad')}
}
async function users(errOnly){
  try{
    const r=await fetch('/api/users');
    if(r.status===403){$('#users').innerHTML='<div class="empty">🔒 admin only</div>';return}
    const d=await r.json();
    $('#users').innerHTML=d.length?d.map(u=>`
      <div class="userrow">
        <div style="display:flex;gap:10px;align-items:center"><b style="font-size:14px">${esc(u.name||u.email||u.id)}</b><span class="rolechip ${u.role==='admin'?'admin':''}">${esc(u.role||'user')}</span><span class="muted small">${esc(u.email||'')}</span>${u.hasPassword?'':'<span class="ownerchip">no password</span>'}</div>
        <button class="btn stop sm" onclick="delUser('${esc(u.id)}')">Delete</button>
      </div>`).join(''):'<div class="empty">no users</div>';
  }catch(e){$('#users').innerHTML='<div class="empty">load fail</div>'}
}
async function addUser(){
  const email=$('#email').value.trim(),role=$('#role').value,name=$('#uname').value.trim(),password=$('#upw').value;
  if(!email)return alert('Enter an email');
  if(password&&password.length<6)return alert('password min 6');
  const body={email,role}; if(name)body.name=name; if(password)body.password=password;
  const r=await (await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  $('#email').value='';$('#upw').value='';$('#uname').value='';
  $('#ustat').textContent=r.error?'❌ '+r.error:'✅ added';
  users();
}
async function delUser(id){if(!confirm('delete user?'))return;await fetch('/api/users/'+id,{method:'DELETE'});users();}
async function list(){
  try{
    const r=await fetch('/api/servers');
    if(!r.ok){$('#list').innerHTML='<div class="empty">🔒 admin login required — <a href="/login">/login</a></div>';return}
    const d=await r.json();
    $('#list').innerHTML=d.map(s=>`
      <div class="card srvrow hoverable">
        <div><b style="font-size:14.5px">${avat(s.type)} ${esc(s.name)}</b> <span class="muted small">${s.type} ${s.version} • ${s.ram||4096}MB${s.cpu?` • ${s.cpu} cores`:''}</span>
          <br><span class="pill ${s.running?'on':''}" style="margin-top:5px"><span class="dot"></span>${s.running?'Online':'Offline'}</span>
          ${s.owner?`<span class="ownerchip" style="margin-left:8px">owner: ${esc(s.createdByName||s.owner.slice(0,8))}</span>`:'<span class="ownerchip" style="margin-left:8px">legacy</span>'}</div>
        <div class="rowbtn">
          <button class="btn primary sm" onclick="location.href='/server/${s.id}'">🖥️ Panel</button>
          <button class="btn ghost sm" onclick="restart('${s.id}')">🔄 Restart</button>
          <button class="btn stop sm" onclick="del('${s.id}')">Delete</button>
        </div>
      </div>`).join('');
  }catch(e){$('#list').innerHTML='<div class="empty">load fail</div>'}
}
async function restart(id){toast('Restarting…');await fetch(`/api/servers/${id}/restart`,{method:'POST'});setTimeout(list,2500);}
async function del(id){if(!confirm('DELETE SERVER - the whole folder will be removed! Sure?'))return;const r=await (await fetch('/api/servers/'+id,{method:'DELETE'})).json();toast(r.error?('❌ '+r.error):(r.warning?('⚠ '+r.warning):'Deleted ✅'),r.error?'bad':(r.warning?'bad':'ok'));setTimeout(list,800);}
me().then(() => { if (ME && ME.role === 'admin') list(); }); // non-admin holei list() chole jeto — adpathi server list overwrite hoto
setInterval(() => { if (ME && ME.role === 'admin') list(); }, 12000);
</script>
<script src="/ux.js"></script>
</body>
</html>
